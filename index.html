      // State variables
      let currentTab = "mcq1";
      let scores = { mcq1: 0, mcq2: 0, mcq3: 0, tf: 0 };
      let answered = {
        mcq1: new Set(),
        mcq2: new Set(),
        mcq3: new Set(),
        tf: new Set(),
      };
      let translationState = {}; // { 'mcq1-0': true (isArabic) }
      let userChoices = {}; // { 'mcq1-0': 2, 'essay-ans-essay-0': true } - Stores chosen options & UI states

      // Initialization
      window.onload = () => {
        loadState(); // Load saved state from sessionStorage
        switchTab("mcq1");
        updateScoreDisplay();
      };

      function saveState() {
        const state = {
          scores: scores,
          answered: {
            mcq1: Array.from(answered.mcq1),
            mcq2: Array.from(answered.mcq2),
            mcq3: Array.from(answered.mcq3),
            tf: Array.from(answered.tf),
          },
          userChoices: userChoices,
          translationState: translationState,
        };
        sessionStorage.setItem("dssQuizState", JSON.stringify(state));
      }

      function loadState() {
        const saved = sessionStorage.getItem("dssQuizState");
        if (saved) {
          try {
            const state = JSON.parse(saved);
            scores = state.scores || { mcq1: 0, mcq2: 0, mcq3: 0, tf: 0 };
            answered = {
              mcq1: new Set(state.answered?.mcq1 || []),
              mcq2: new Set(state.answered?.mcq2 || []),
              mcq3: new Set(state.answered?.mcq3 || []),
              tf: new Set(state.answered?.tf || []),
            };
            userChoices = state.userChoices || {};
            translationState = state.translationState || {};
          } catch (e) {
            console.error("Error loading state", e);
          }
        }
      }

      function switchTab(tabId) {
        currentTab = tabId;
        document.querySelectorAll(".tab-btn").forEach((btn) => {
          btn.classList.remove("bg-blue-100", "text-blue-800");
          btn.classList.add("text-gray-600");
        });
        const activeBtn = document.getElementById(`tab-${tabId}`);
        if (activeBtn) {
          activeBtn.classList.remove("text-gray-600");
          activeBtn.classList.add("bg-blue-100", "text-blue-800");
        }
        renderContent(tabId);
      }

      function renderContent(tabId) {
        const container = document.getElementById("quiz-container");
        container.innerHTML = "";

        // 1. Render all HTML structures first
        db[tabId].forEach((item, index) => {
          if (tabId.startsWith("mcq"))
            container.appendChild(createMCQCard(item, index, tabId));
          else if (tabId === "tf")
            container.appendChild(createTFCard(item, index, tabId));
          else if (tabId === "essay")
            container.appendChild(createEssayCard(item, index, tabId));
        });

        // 2. Restore Visual State (Answers, Translations, Visibilities)
        db[tabId].forEach((item, index) => {
          const id = `${tabId}-${index}`;

          // Restore Translation if it was active
          if (translationState[id]) {
            applyTranslation(tabId, index);
          }

          // Restore Answers
          if (answered[tabId] && answered[tabId].has(index)) {
            const savedVal = userChoices[id];
            if (tabId.startsWith("mcq")) {
              applyMCQFeedback(tabId, index, savedVal, item.ans);
            } else if (tabId === "tf") {
              applyTFFeedback(tabId, index, savedVal, item.ans);
            }
          }

          // Restore Essay visibility
          if (tabId === "essay") {
            const essayAnsId = `essay-ans-${id}`;
            if (userChoices[essayAnsId]) {
              const el = document.getElementById(essayAnsId);
              if (el) {
                el.classList.remove("hidden");
                el.setAttribute("data-visible", "true");
              }
            }
          }
        });
      }

      function toggleTranslation(tabId, index) {
        const id = `${tabId}-${index}`;
        translationState[id] = !translationState[id]; // Toggle value
        saveState(); // Save to memory
        applyTranslation(tabId, index); // Update UI
      }

      function applyTranslation(tabId, index) {
        const id = `${tabId}-${index}`;
        const isAr = translationState[id];

        const qEl = document.getElementById(`q-text-${id}`);
        if (!qEl) return;
        const item = db[tabId][index];

        // Toggle Question Text
        qEl.innerHTML = isAr ? item.ar_q : item.q;
        qEl.className = isAr
          ? "text-lg font-bold text-gray-800 mb-4 ar-text"
          : "text-lg font-bold text-gray-800 mb-4 en-text";

        // Toggle Options
        if (tabId.startsWith("mcq")) {
          item.options.forEach((opt, oIdx) => {
            const btn = document.getElementById(`btn-${id}-${oIdx}`);
            if (btn) {
              btn.innerText = isAr ? item.ar_options[oIdx] : opt;
              if (isAr) {
                btn.classList.remove("en-text");
                btn.classList.add("ar-text");
              } else {
                btn.classList.remove("ar-text");
                btn.classList.add("en-text");
              }
            }
          });
        } else if (tabId === "tf") {
          const btnT = document.getElementById(`btn-${id}-true`);
          const btnF = document.getElementById(`btn-${id}-false`);
          if (btnT) btnT.innerText = isAr ? "صح (True)" : "True (صح)";
          if (btnF) btnF.innerText = isAr ? "خطأ (False)" : "False (خطأ)";
        } else if (tabId === "essay") {
          const ansEl = document.getElementById(`essay-ans-${id}`);
          if (ansEl) {
            ansEl.innerHTML = isAr ? item.ar_ans : item.ans;
            ansEl.className = isAr
              ? "mt-2 p-4 bg-blue-50 border-r-4 border-blue-500 rounded-l-md text-gray-800 leading-relaxed ar-text"
              : "mt-2 p-4 bg-blue-50 border-l-4 border-blue-500 rounded-r-md text-gray-800 leading-relaxed en-text text-left";
            // Respect visibility state
            if (ansEl.getAttribute("data-visible") !== "true")
              ansEl.classList.add("hidden");
          }
        }
      }

      function toggleHint(tabId, index) {
        const hintEl = document.getElementById(`hint-${tabId}-${index}`);
        hintEl.classList.toggle("hidden");
      }

      function getControlButtons(tabId, index) {
        return `
                <div class="flex justify-end space-x-2 space-x-reverse mb-4">
                    <button onclick="toggleHint('${tabId}', ${index})" class="bg-yellow-100 hover:bg-yellow-200 text-yellow-800 px-3 py-1 rounded text-sm font-semibold transition-colors">💡 تلميح</button>
                    <button onclick="toggleTranslation('${tabId}', ${index})" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1 rounded text-sm font-semibold transition-colors">🌐 ترجمة</button>
                </div>
            `;
      }

      function createMCQCard(item, index, tabId) {
        const card = document.createElement("div");
        card.className =
          "bg-white p-6 rounded-xl shadow-sm border border-gray-100 fade-in";

        let html = getControlButtons(tabId, index);
        html += `<h3 id="q-text-${tabId}-${index}" class="text-lg font-bold text-gray-800 mb-4 en-text">${item.q}</h3>`;
        html += `<div id="hint-${tabId}-${index}" class="hidden mb-4 p-3 bg-yellow-50 text-yellow-900 border-r-4 border-yellow-400 rounded text-sm font-semibold">${item.hint}</div>`;

        html += `<div class="space-y-3">`;
        item.options.forEach((opt, optIndex) => {
          html += `
                    <button 
                        id="btn-${tabId}-${index}-${optIndex}"
                        class="option-btn en-text w-full text-left px-4 py-3 rounded-lg border border-gray-200 hover:bg-blue-50 focus:outline-none"
                        onclick="handleMCQAnswer('${tabId}', ${index}, ${optIndex}, ${item.ans})"
                    >
                        ${opt}
                    </button>
                `;
        });
        html += `</div>`;
        html += `<div id="feedback-${tabId}-${index}" class="mt-4 hidden p-4 rounded-lg font-semibold text-sm leading-relaxed border"></div>`;

        card.innerHTML = html;
        return card;
      }

      function handleMCQAnswer(tabId, qIndex, selectedOpt, correctOpt) {
        if (answered[tabId].has(qIndex)) return; // Prevent answering again

        const id = `${tabId}-${qIndex}`;
        userChoices[id] = selectedOpt;
        answered[tabId].add(qIndex);

        if (selectedOpt === correctOpt) {
          scores[tabId]++;
        }

        saveState();
        updateScoreDisplay();
        applyMCQFeedback(tabId, qIndex, selectedOpt, correctOpt);
      }

      function applyMCQFeedback(tabId, qIndex, selectedOpt, correctOpt) {
        const buttons = document.querySelectorAll(
          `[id^="btn-${tabId}-${qIndex}-"]`,
        );
        buttons.forEach((btn) => {
          btn.disabled = true;
          btn.classList.add("cursor-not-allowed", "opacity-60");
        });

        const selectedBtn = document.getElementById(
          `btn-${tabId}-${qIndex}-${selectedOpt}`,
        );
        const correctBtn = document.getElementById(
          `btn-${tabId}-${qIndex}-${correctOpt}`,
        );
        const feedback = document.getElementById(`feedback-${tabId}-${qIndex}`);
        const item = db[tabId][qIndex];

        if (!feedback) return;
        feedback.classList.remove("hidden");

        if (selectedOpt === correctOpt) {
          if (selectedBtn) {
            selectedBtn.classList.add("selected-correct");
            selectedBtn.classList.remove("opacity-60");
          }
          feedback.innerHTML = `✅ <b>إجابة صحيفة!</b><br><span class="text-gray-700 mt-2 block font-normal ar-text">${item.exp}</span>`;
          feedback.classList.add(
            "bg-green-50",
            "border-green-200",
            "text-green-800",
          );
        } else {
          if (selectedBtn) {
            selectedBtn.classList.add("selected-wrong");
            selectedBtn.classList.remove("opacity-60");
          }
          if (correctBtn) {
            correctBtn.classList.add("actual-correct");
            correctBtn.classList.remove("opacity-60");
          }
          feedback.innerHTML = `❌ <b>إجابة خاطئة.</b> الإجابة الصحيحة مظللة بالأخضر.<br><span class="text-gray-700 mt-2 block font-normal ar-text">${item.exp}</span>`;
          feedback.classList.add("bg-red-50", "border-red-200", "text-red-800");
        }
      }

      function createTFCard(item, index, tabId) {
        const card = document.createElement("div");
        card.className =
          "bg-white p-6 rounded-xl shadow-sm border border-gray-100 fade-in";

        let html = getControlButtons(tabId, index);
        html += `<h3 id="q-text-${tabId}-${index}" class="text-lg font-bold text-gray-800 mb-4 en-text">${item.q}</h3>`;
        html += `<div id="hint-${tabId}-${index}" class="hidden mb-4 p-3 bg-yellow-50 text-yellow-900 border-r-4 border-yellow-400 rounded text-sm font-semibold">${item.hint}</div>`;

        html += `<div class="flex space-x-4 space-x-reverse">
                        <button id="btn-${tabId}-${index}-true" class="flex-1 option-btn font-bold px-4 py-3 rounded-lg border border-gray-200 hover:bg-blue-50" onclick="handleTFAnswer('${tabId}', ${index}, true, ${item.ans})">True (صح)</button>
                        <button id="btn-${tabId}-${index}-false" class="flex-1 option-btn font-bold px-4 py-3 rounded-lg border border-gray-200 hover:bg-blue-50" onclick="handleTFAnswer('${tabId}', ${index}, false, ${item.ans})">False (خطأ)</button>
                     </div>`;
        html += `<div id="feedback-${tabId}-${index}" class="mt-4 hidden p-4 rounded-lg font-semibold text-sm leading-relaxed border"></div>`;

        card.innerHTML = html;
        return card;
      }

      function handleTFAnswer(tabId, qIndex, selectedVal, correctVal) {
        if (answered[tabId].has(qIndex)) return;

        const id = `${tabId}-${qIndex}`;
        userChoices[id] = selectedVal;
        answered[tabId].add(qIndex);

        if (selectedVal === correctVal) {
          scores[tabId]++;
        }

        saveState();
        updateScoreDisplay();
        applyTFFeedback(tabId, qIndex, selectedVal, correctVal);
      }

      function applyTFFeedback(tabId, qIndex, selectedVal, correctVal) {
        const btnTrue = document.getElementById(`btn-${tabId}-${qIndex}-true`);
        const btnFalse = document.getElementById(
          `btn-${tabId}-${qIndex}-false`,
        );
        if (btnTrue) {
          btnTrue.disabled = true;
          btnTrue.classList.add("cursor-not-allowed", "opacity-60");
        }
        if (btnFalse) {
          btnFalse.disabled = true;
          btnFalse.classList.add("cursor-not-allowed", "opacity-60");
        }

        const selectedBtn = selectedVal ? btnTrue : btnFalse;
        const correctBtn = correctVal ? btnTrue : btnFalse;
        const feedback = document.getElementById(`feedback-${tabId}-${qIndex}`);
        const item = db[tabId][qIndex];

        if (!feedback) return;
        feedback.classList.remove("hidden");

        if (selectedVal === correctVal) {
          if (selectedBtn) {
            selectedBtn.classList.add("selected-correct");
            selectedBtn.classList.remove("opacity-60");
          }
          feedback.innerHTML = `✅ <b>إجابة صحيحة!</b><br><span class="text-gray-700 mt-2 block font-normal ar-text">${item.exp}</span>`;
          feedback.classList.add(
            "bg-green-50",
            "border-green-200",
            "text-green-800",
          );
        } else {
          if (selectedBtn) {
            selectedBtn.classList.add("selected-wrong");
            selectedBtn.classList.remove("opacity-60");
          }
          if (correctBtn) {
            correctBtn.classList.add("actual-correct");
            correctBtn.classList.remove("opacity-60");
          }
          feedback.innerHTML = `❌ <b>إجابة خاطئة.</b><br><span class="text-gray-700 mt-2 block font-normal ar-text">${item.exp}</span>`;
          feedback.classList.add("bg-red-50", "border-red-200", "text-red-800");
        }
      }

      function createEssayCard(item, index, tabId) {
        const card = document.createElement("div");
        card.className =
          "bg-white p-6 rounded-xl shadow-sm border border-gray-100 fade-in";

        let html = getControlButtons(tabId, index);
        html += `<h3 id="q-text-${tabId}-${index}" class="text-lg font-bold text-gray-800 mb-4 en-text">${item.q}</h3>`;
        html += `<div id="hint-${tabId}-${index}" class="hidden mb-4 p-3 bg-yellow-50 text-yellow-900 border-r-4 border-yellow-400 rounded text-sm font-semibold">${item.hint}</div>`;

        html += `
                <button onclick="toggleAnswer('essay-ans-${tabId}-${index}')" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-800 px-4 py-2 rounded-md font-semibold mb-3 transition-colors border">
                    إظهار / إخفاء الإجابة النموذجية
                </button>
                <div id="essay-ans-${tabId}-${index}" data-visible="false" class="hidden mt-2 p-4 bg-blue-50 border-l-4 border-blue-500 rounded-r-md text-gray-800 leading-relaxed en-text text-left">
                    ${item.ans}
                </div>
            `;

        card.innerHTML = html;
        return card;
      }

      function toggleAnswer(id) {
        const el = document.getElementById(id);
        if (!el) return;
        const isHidden = el.classList.contains("hidden");

        if (isHidden) {
          el.classList.remove("hidden");
          el.classList.add("fade-in");
          el.setAttribute("data-visible", "true");
          userChoices[id] = true; // Save visibility state
        } else {
          el.classList.add("hidden");
          el.classList.remove("fade-in");
          el.setAttribute("data-visible", "false");
          userChoices[id] = false;
        }
        saveState(); // Save to memory
      }

      function updateScoreDisplay() {
        const totalScore = scores.mcq1 + scores.mcq2 + scores.mcq3 + scores.tf;
        const answeredCount =
          (answered.mcq1?.size || 0) +
          (answered.mcq2?.size || 0) +
          (answered.mcq3?.size || 0) +
          (answered.tf?.size || 0);
        document.getElementById("score-display").innerText =
          `${totalScore} / ${answeredCount}`;
      }
    </script>
  </body>
</html>
