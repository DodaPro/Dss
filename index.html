        mcq2: new Set(),
        mcq3: new Set(),
        tf: new Set(),
      };
      let translationState = {};
      let userChoices = {};

      // App Initialization
      function initApp() {
        initTheme();
        loadState();
        switchTab("mcq2");
        updateScore();
      }

      // State Management
      function saveState() {
        const state = {
          scores,
          answered: {
            mcq1: [...answered.mcq1],
            mcq2: [...answered.mcq2],
            mcq3: [...answered.mcq3],
            tf: [...answered.tf],
          },
          userChoices,
          translationState,
        };
        sessionStorage.setItem("dss_quiz_data", JSON.stringify(state));
      }

      function loadState() {
        try {
          const saved = sessionStorage.getItem("dss_quiz_data");
          if (saved) {
            const state = JSON.parse(saved);
            scores = state.scores || scores;
            answered = {
              mcq1: new Set(state.answered?.mcq1 || []),
              mcq2: new Set(state.answered?.mcq2 || []),
              mcq3: new Set(state.answered?.mcq3 || []),
              tf: new Set(state.answered?.tf || []),
            };
            userChoices = state.userChoices || {};
            translationState = state.translationState || {};
          }
        } catch (e) {}
      }

      // Tabs Logic
      function switchTab(tabId) {
        currentTab = tabId;
        document.querySelectorAll(".tab-btn").forEach((btn) => {
          btn.className =
            "tab-btn whitespace-nowrap px-3 py-1 rounded text-xs md:text-sm font-semibold text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors";
        });
        document.getElementById(`tab-${tabId}`).className =
          "tab-btn whitespace-nowrap px-3 py-1 rounded text-xs md:text-sm font-bold bg-indigo-100 dark:bg-indigo-900 text-indigo-800 dark:text-indigo-200";

        const container = document.getElementById("quiz-container");
        container.innerHTML = "";

        db[tabId].forEach((item, idx) => {
          let cardHTML = "";
          if (tabId.startsWith("mcq")) cardHTML = generateMCQ(item, idx, tabId);
          else if (tabId === "tf") cardHTML = generateTF(item, idx, tabId);
          else cardHTML = generateEssay(item, idx, tabId);

          const div = document.createElement("div");
          div.className =
            "bg-white dark:bg-gray-800 p-4 md:p-5 rounded-lg shadow border border-gray-100 dark:border-gray-700";
          div.innerHTML = cardHTML;
          container.appendChild(div);

          // Restore UI State
          if (translationState[`${tabId}-${idx}`])
            renderTranslation(tabId, idx, true);
          if (answered[tabId] && answered[tabId].has(idx)) {
            if (tabId.startsWith("mcq"))
              renderMCQAnswer(
                tabId,
                idx,
                userChoices[`${tabId}-${idx}`],
                item.ans,
              );
            if (tabId === "tf")
              renderTFAnswer(
                tabId,
                idx,
                userChoices[`${tabId}-${idx}`],
                item.ans,
              );
          }
          if (tabId === "essay" && userChoices[`essay-ans-${tabId}-${idx}`]) {
            document
              .getElementById(`essay-ans-${tabId}-${idx}`)
              .classList.remove("hidden");
          }
        });
      }

      // UI Generators
      function getControls(tabId, idx) {
        return `
                <div class="flex justify-end gap-2 mb-3">
                    <button onclick="document.getElementById('hint-${tabId}-${idx}').classList.toggle('hidden')" class="bg-yellow-100 text-yellow-800 dark:bg-yellow-900/50 dark:text-yellow-200 px-2 py-1 rounded text-xs font-bold border border-yellow-200 dark:border-yellow-700">💡 تلميح</button>
                    <button onclick="toggleLang('${tabId}', ${idx})" class="bg-gray-200 text-gray-800 dark:bg-gray-700 dark:text-gray-200 px-2 py-1 rounded text-xs font-bold border border-gray-300 dark:border-gray-600">🌐 ترجمة</button>
                </div>
            `;
      }

      function generateMCQ(item, idx, tId) {
        let html = getControls(tId, idx);
        html += `<h3 id="q-${tId}-${idx}" class="text-sm md:text-base font-bold text-gray-800 dark:text-gray-100 mb-3 en-text">${item.q}</h3>`;
        html += `<div id="hint-${tId}-${idx}" class="hidden mb-3 p-2 bg-yellow-50 dark:bg-yellow-900/30 text-yellow-900 dark:text-yellow-200 text-xs rounded border-r-2 border-yellow-400 font-bold">${item.hint}</div>`;
        html += `<div class="space-y-2">`;
        item.options.forEach((opt, oIdx) => {
          html += `<button id="btn-${tId}-${idx}-${oIdx}" class="w-full text-left px-3 py-2 rounded border border-gray-200 dark:border-gray-700 dark:bg-gray-700 hover:bg-indigo-50 dark:hover:bg-gray-600 text-xs md:text-sm en-text option-btn" onclick="ansMCQ('${tId}', ${idx}, ${oIdx})">${opt}</button>`;
        });
        html += `</div><div id="fb-${tId}-${idx}" class="mt-3 hidden p-2 rounded text-xs font-bold"></div>`;
        return html;
      }

      function generateTF(item, idx, tId) {
        let html = getControls(tId, idx);
        html += `<h3 id="q-${tId}-${idx}" class="text-sm md:text-base font-bold text-gray-800 dark:text-gray-100 mb-3 en-text">${item.q}</h3>`;
        html += `<div id="hint-${tId}-${idx}" class="hidden mb-3 p-2 bg-yellow-50 dark:bg-yellow-900/30 text-yellow-900 dark:text-yellow-200 text-xs rounded border-r-2 border-yellow-400 font-bold">${item.hint}</div>`;
        html += `<div class="flex gap-2">
                        <button id="btn-${tId}-${idx}-t" class="flex-1 px-3 py-2 rounded border border-gray-200 dark:border-gray-700 dark:bg-gray-700 hover:bg-indigo-50 dark:hover:bg-gray-600 text-xs md:text-sm font-bold option-btn" onclick="ansTF('${tId}', ${idx}, true)">True (صح)</button>
                        <button id="btn-${tId}-${idx}-f" class="flex-1 px-3 py-2 rounded border border-gray-200 dark:border-gray-700 dark:bg-gray-700 hover:bg-indigo-50 dark:hover:bg-gray-600 text-xs md:text-sm font-bold option-btn" onclick="ansTF('${tId}', ${idx}, false)">False (خطأ)</button>
                     </div>`;
        html += `<div id="fb-${tId}-${idx}" class="mt-3 hidden p-2 rounded text-xs font-bold"></div>`;
        return html;
      }

      function generateEssay(item, idx, tId) {
        let html = getControls(tId, idx);
        html += `<h3 id="q-${tId}-${idx}" class="text-sm md:text-base font-bold text-gray-800 dark:text-gray-100 mb-3 en-text">${item.q}</h3>`;
        html += `<div id="hint-${tId}-${idx}" class="hidden mb-3 p-2 bg-yellow-50 dark:bg-yellow-900/30 text-yellow-900 dark:text-yellow-200 text-xs rounded border-r-2 border-yellow-400 font-bold">${item.hint}</div>`;
        html += `<button onclick="toggleEssay('${tId}', ${idx})" class="text-xs bg-gray-200 dark:bg-gray-700 px-3 py-1.5 rounded font-bold hover:bg-gray-300 dark:hover:bg-gray-600">إظهار/إخفاء الإجابة</button>
                     <div id="essay-ans-${tId}-${idx}" class="hidden mt-2 p-3 bg-indigo-50 dark:bg-gray-700 border-l-4 border-indigo-500 rounded text-xs md:text-sm en-text">${item.ans}</div>`;
        return html;
      }

      // Logic & Feedback
      function ansMCQ(tId, idx, selected) {
        if (answered[tId].has(idx)) return;
        const correct = db[tId][idx].ans;
        userChoices[`${tId}-${idx}`] = selected;
        answered[tId].add(idx);
        if (selected === correct) scores[tId]++;
        saveState();
        updateScore();
        renderMCQAnswer(tId, idx, selected, correct);
      }

      function renderMCQAnswer(tId, idx, selected, correct) {
        const item = db[tId][idx];
        document.querySelectorAll(`[id^="btn-${tId}-${idx}-"]`).forEach((b) => {
          b.disabled = true;
          b.classList.add("opacity-50", "cursor-not-allowed");
        });
        const fb = document.getElementById(`fb-${tId}-${idx}`);
        fb.classList.remove("hidden");

        if (selected === correct) {
          document
            .getElementById(`btn-${tId}-${idx}-${selected}`)
            .classList.add("selected-correct");
          fb.innerHTML = `✅ صحيح! <span class="block mt-1 font-normal ar-text">${item.exp}</span>`;
          fb.className =
            "mt-3 p-2 rounded text-xs font-bold bg-green-100 dark:bg-green-900/40 text-green-800 dark:text-green-200";
        } else {
          document
            .getElementById(`btn-${tId}-${idx}-${selected}`)
            .classList.add("selected-wrong");
          document
            .getElementById(`btn-${tId}-${idx}-${correct}`)
            .classList.add("actual-correct");
          fb.innerHTML = `❌ خطأ. <span class="block mt-1 font-normal ar-text">${item.exp}</span>`;
          fb.className =
            "mt-3 p-2 rounded text-xs font-bold bg-red-100 dark:bg-red-900/40 text-red-800 dark:text-red-200";
        }
      }

      function ansTF(tId, idx, selected) {
        if (answered[tId].has(idx)) return;
        const correct = db[tId][idx].ans;
        userChoices[`${tId}-${idx}`] = selected;
        answered[tId].add(idx);
        if (selected === correct) scores[tId]++;
        saveState();
        updateScore();
        renderTFAnswer(tId, idx, selected, correct);
      }

      function renderTFAnswer(tId, idx, selected, correct) {
        const item = db[tId][idx];
        const btnT = document.getElementById(`btn-${tId}-${idx}-t`);
        const btnF = document.getElementById(`btn-${tId}-${idx}-f`);
        btnT.disabled = true;
        btnF.disabled = true;
        btnT.classList.add("opacity-50", "cursor-not-allowed");
        btnF.classList.add("opacity-50", "cursor-not-allowed");

        const selectedBtn = selected ? btnT : btnF;
        const correctBtn = correct ? btnT : btnF;
        const fb = document.getElementById(`fb-${tId}-${idx}`);
        fb.classList.remove("hidden");

        if (selected === correct) {
          selectedBtn.classList.add("selected-correct");
          fb.innerHTML = `✅ صحيح! <span class="block mt-1 font-normal ar-text">${item.exp}</span>`;
          fb.className =
            "mt-3 p-2 rounded text-xs font-bold bg-green-100 dark:bg-green-900/40 text-green-800 dark:text-green-200";
        } else {
          selectedBtn.classList.add("selected-wrong");
          correctBtn.classList.add("actual-correct");
          fb.innerHTML = `❌ خطأ. <span class="block mt-1 font-normal ar-text">${item.exp}</span>`;
          fb.className =
            "mt-3 p-2 rounded text-xs font-bold bg-red-100 dark:bg-red-900/40 text-red-800 dark:text-red-200";
        }
      }

      function toggleEssay(tId, idx) {
        const el = document.getElementById(`essay-ans-${tId}-${idx}`);
        el.classList.toggle("hidden");
        userChoices[`essay-ans-${tId}-${idx}`] =
          !el.classList.contains("hidden");
        saveState();
      }

      function toggleLang(tId, idx) {
        translationState[`${tId}-${idx}`] = !translationState[`${tId}-${idx}`];
        saveState();
        renderTranslation(tId, idx, translationState[`${tId}-${idx}`]);
      }

      function renderTranslation(tId, idx, isAr) {
        const item = db[tId][idx];
        const qEl = document.getElementById(`q-${tId}-${idx}`);
        if (qEl) {
          qEl.innerHTML = isAr ? item.ar_q : item.q;
          qEl.className = isAr
            ? "text-sm md:text-base font-bold text-gray-800 dark:text-gray-100 mb-3 ar-text"
            : "text-sm md:text-base font-bold text-gray-800 dark:text-gray-100 mb-3 en-text";
        }
        if (tId.startsWith("mcq")) {
          item.options.forEach((opt, oIdx) => {
            const btn = document.getElementById(`btn-${tId}-${idx}-${oIdx}`);
            if (btn) {
              btn.innerText = isAr ? item.ar_options[oIdx] : opt;
              btn.className = btn.className.replace(
                /en-text|ar-text/,
                isAr ? "ar-text" : "en-text",
              );
            }
          });
        } else if (tId === "tf") {
          const btnT = document.getElementById(`btn-${tId}-${idx}-t`);
          const btnF = document.getElementById(`btn-${tId}-${idx}-f`);
          if (btnT) btnT.innerText = isAr ? "صح" : "True";
          if (btnF) btnF.innerText = isAr ? "خطأ" : "False";
        } else if (tId === "essay") {
          const aEl = document.getElementById(`essay-ans-${tId}-${idx}`);
          if (aEl) {
            aEl.innerHTML = isAr ? item.ar_ans : item.ans;
            aEl.className = aEl.className.replace(
              /en-text|ar-text/,
              isAr ? "ar-text" : "en-text",
            );
            aEl.className = aEl.className.replace(
              /border-l-4|border-r-4/,
              isAr ? "border-r-4" : "border-l-4",
            );
          }
        }
      }

      function updateScore() {
        const tot = scores.mcq1 + scores.mcq2 + scores.mcq3 + scores.tf;
        const ans =
          answered.mcq1.size +
          answered.mcq2.size +
          answered.mcq3.size +
          answered.tf.size;
        document.getElementById("score-display").innerText = `${tot} / ${ans}`;
      }

      // Dark Mode Logic
      function initTheme() {
        const btn = document.getElementById("theme-toggle");
        const dIcon = document.getElementById("theme-toggle-dark-icon");
        const lIcon = document.getElementById("theme-toggle-light-icon");

        const isDark =
          localStorage.getItem("theme") === "dark" ||
          (!("theme" in localStorage) &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) {
          document.documentElement.classList.add("dark");
          lIcon.classList.remove("hidden");
        } else {
          document.documentElement.classList.remove("dark");
          dIcon.classList.remove("hidden");
        }

        btn.onclick = () => {
          dIcon.classList.toggle("hidden");
          lIcon.classList.toggle("hidden");
          document.documentElement.classList.toggle("dark");
          localStorage.setItem(
            "theme",
            document.documentElement.classList.contains("dark")
              ? "dark"
              : "light",
          );
        };
      }

      // Boot
      window.onload = initApp;
    </script>
  </body>
</html>
